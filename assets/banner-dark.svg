<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Satyajit Debnath — Founder, Monkdevelopers. End-to-end product engineering for fintech, commerce and operations.">
<defs>
  <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#21262D"/></pattern>
  <radialGradient id="glow" cx="78%" cy="50%" r="45%"><stop offset="0" stop-color="#1F6FEB" stop-opacity=".18"/><stop offset="1" stop-color="#1F6FEB" stop-opacity="0"/></radialGradient>
  <linearGradient id="fade" x1="0" x2="1"><stop offset=".35" stop-color="#0D1117"/><stop offset=".6" stop-color="#0D1117" stop-opacity="0"/></linearGradient>
</defs>
<style>
  .k{font:600 13px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;letter-spacing:.14em;fill:#2F81F7}
  .h{font:700 54px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:-.02em;fill:#F0F6FC}
  .tg{font:400 22px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#C9D1D9;opacity:0;animation:rot 12s infinite}
  .tg:nth-of-type(2){animation-delay:4s} .tg:nth-of-type(3){animation-delay:8s}
  @keyframes rot{0%{opacity:0;transform:translateY(8px)}4%,30%{opacity:1;transform:none}34%,100%{opacity:0;transform:translateY(-6px)}}
  .p{font:500 13px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#3FB950}
  .n{font:500 13px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;fill:#C9D1D9}
  .w{fill:none;stroke:#30363D;stroke-width:1.5}
  .f{fill:none;stroke:#2F81F7;stroke-width:2;stroke-linecap:round;stroke-dasharray:6 90;animation:flow 3.2s linear infinite}
  .f2{animation-delay:-1.1s} .f3{animation-delay:-2.2s}
  @keyframes flow{to{stroke-dashoffset:-96}}
  .dot{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}
  @keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.6);opacity:0}}
  .in{opacity:0;animation:in .8s ease-out forwards}
  @keyframes in{to{opacity:1}}
  @media (prefers-reduced-motion:reduce){.tg{animation:none}.tg:first-of-type{opacity:1}.f,.dot,.in{animation:none;opacity:1}}
</style>
<rect width="1200" height="300" fill="#0D1117"/>
<rect width="1200" height="300" fill="url(#g)"/>
<rect width="1200" height="300" fill="url(#glow)"/>
<rect width="1200" height="300" fill="url(#fade)"/>

<!-- architecture motif: three surfaces → one core → data -->
<g class="in" style="animation-delay:.2s">
  <path class="w" d="M836 86 C900 86 900 150 950 150"/>
  <path class="w" d="M836 150 L950 150"/>
  <path class="w" d="M836 214 C900 214 900 150 950 150"/>
  <path class="w" d="M1050 150 L1110 150"/>
  <path class="f" d="M836 86 C900 86 900 150 950 150"/>
  <path class="f f2" d="M836 150 L950 150"/>
  <path class="f f3" d="M836 214 C900 214 900 150 950 150"/>
  <path class="f" d="M1050 150 L1110 150" style="stroke-dasharray:6 54;animation-duration:2s"/>
  <g class=""><rect x="726" y="69" width="110" height="34" rx="8" fill="#161B22" stroke="#30363D"/><text x="781.0" y="91" text-anchor="middle" class="n">web</text></g>
  <g class=""><rect x="726" y="133" width="110" height="34" rx="8" fill="#161B22" stroke="#30363D"/><text x="781.0" y="155" text-anchor="middle" class="n">ops</text></g>
  <g class=""><rect x="726" y="197" width="110" height="34" rx="8" fill="#161B22" stroke="#30363D"/><text x="781.0" y="219" text-anchor="middle" class="n">mobile</text></g>
  <rect x="950" y="128" width="100" height="44" rx="10" fill="#161B22" stroke="#2F81F7" stroke-width="1.5"/>
  <text x="1000" y="155" text-anchor="middle" class="n" style="fill:#2F81F7;font-weight:600">core</text>
  <g><rect x="1110" y="133" width="62" height="34" rx="8" fill="#161B22" stroke="#30363D"/>
  <ellipse cx="1141" cy="143" rx="13" ry="4" fill="none" stroke="#C9D1D9" stroke-width="1.3"/>
  <path d="M1128 143 v14 a13 4 0 0 0 26 0 v-14" fill="none" stroke="#C9D1D9" stroke-width="1.3"/></g>
</g>

<g class="in">
  <text x="64" y="84" class="k">FOUNDER · MONKDEVELOPERS</text>
  <text x="62" y="148" class="h">Satyajit Debnath</text>
</g>
<g transform="translate(64 192)">
  <text class="tg">Fintech platforms that move money correctly.</text>
  <text class="tg">Commerce systems: one backend, many surfaces.</text>
  <text class="tg">Operations software that replaces spreadsheets.</text>
</g>
<g class="in" style="animation-delay:.5s">
  <rect x="64" y="222" width="232" height="30" rx="15" fill="#0F2A1A" stroke="#1F5F33"/>
  <circle cx="84" cy="237" r="4.5" fill="#3FB950"/>
  <circle class="dot" cx="84" cy="237" r="4.5" fill="#3FB950"/>
  <text x="98" y="242" class="p">Taking on new projects</text>
</g>
</svg>
